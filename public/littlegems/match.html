<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match game · LittleGems by MemoriGems</title>
<meta name="description" content="A free social-emotional learning game for kids. Match each feeling to the moment that causes it, and collect gems along the way.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* LittleGems "Crayon box" theme — shared by the color studio, coloring sheets and the three games (Oct 2026).
     CONTRAST (white text): coral-deep #A9471F 5.8:1 · sky-deep #2E6B78 6.0:1 · mint-deep #3F7A4A 5.1:1.
     Light coral, sky, mint and sun are for fills, gems and borders only, never for small text. */
  :root{
    --bg:#FFF6EC;--paper:#FFFFFF;--line:#F2D9C4;--line-strong:#E6C2A6;
    --coral:#E07A52;--coral-deep:#A9471F;--coral-soft:#FDEDE4;
    --sky:#4E97A6;--sky-deep:#2E6B78;--sky-soft:#E4F1F4;
    --mint:#6BA876;--mint-deep:#3F7A4A;--mint-soft:#E8F3E9;
    --sun-soft:#FBF0DC;--sun-line:#E6C68A;
    --ink:#2A2317;--ink-soft:#524634;
    --round:'Fredoka','Nunito',system-ui,sans-serif;--sans:'Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);font-weight:700;color:var(--ink);background:var(--bg);padding:20px 16px 40px;min-height:100vh}
  button{font:inherit;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
  p{margin:0}
  .wrap{max-width:1040px;margin:0 auto}

  .lg-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .lg-back{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink-soft);background:var(--paper);border:2px solid var(--line);border-radius:100px;padding:9px 16px;transition:.2s}
  .lg-back:hover{border-color:var(--coral-deep);color:var(--coral-deep)}
  .lg-back svg{width:16px;height:16px}
  .lg-jumps{display:flex;gap:8px;margin-left:auto}
  .jump-btn{display:inline-flex;align-items:center;font-family:var(--round);font-weight:500;font-size:14px;padding:8px 14px;border-radius:100px;border:2px solid var(--line);color:var(--ink-soft);background:var(--paper);text-decoration:none;white-space:nowrap;transition:.2s}
  a.jump-btn:hover{border-color:var(--coral-deep);color:var(--coral-deep)}
  .jump-btn.active{background:var(--coral-deep);border-color:var(--coral-deep);color:#fff;cursor:default}

  .ttl{margin:0 0 16px}
  .ttl h1{margin:0;font-family:var(--round);font-weight:600;font-size:clamp(28px,4vw,36px);line-height:1.05;color:var(--ink-soft)}
  .ttl h1 em{font-style:normal;color:var(--coral-deep)}
  .ttl .sub{margin-top:6px;font-size:17px;font-weight:600;color:var(--ink-soft)}

  .card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:22px}
  .gl{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px}
  .jar-wrap{display:flex;align-items:center;gap:14px}
  .jar-wrap svg{flex:0 0 auto;width:96px;height:108px}
  .jar-title{font-family:var(--round);font-weight:600;font-size:20px;color:var(--ink-soft);margin:0 0 2px}
  .jar-total{font-size:15px;color:var(--ink-soft);margin:0}
  .jar-total #totalNum{font-family:var(--round);font-weight:600;font-size:24px;color:var(--coral-deep)}
  .jar-reset{font-weight:800;font-size:13px;color:var(--coral-deep);background:none;border:none;cursor:pointer;margin-top:6px;padding:0;text-decoration:underline}
  .namebar{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--line);padding-top:12px}
  .namebar label{font-size:13px;font-weight:800;color:var(--ink-soft)}
  .namebar input{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--ink);border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;outline:none;width:100%}
  .namebar input:focus{border-color:var(--sky-deep)}
  .namebar input::placeholder{color:#8A7C68}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--round);font-weight:500;font-size:18px;padding:13px 28px;border-radius:16px;background:var(--coral-deep);color:#fff;border:none;cursor:pointer;transition:.2s}
  .btn:hover{background:#923B17;transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;cursor:default;transform:none}
  .msg{text-align:center;margin-top:16px;min-height:26px;font-size:17px;font-weight:700;color:var(--ink-soft)}
  .msg .ok{color:var(--mint-deep);font-weight:800}
  .msg .win{color:var(--coral-deep);font-weight:800}
  .controls{text-align:center;margin-top:12px}
  .foot{text-align:center;margin-top:24px;font-size:14px;font-weight:600;color:var(--ink-soft)}
  .foot a{color:var(--coral-deep);font-weight:800;text-decoration:none}

  @media (max-width:860px){
    .gl{grid-template-columns:minmax(0,1fr);gap:12px}
    .side{order:-1;flex-direction:row;align-items:center;gap:12px;padding:10px 14px;border-radius:18px}
    .jar-wrap{flex:1;gap:10px}
    .jar-wrap svg{width:48px;height:54px}
    .jar-title{font-size:16px}
    .jar-total #totalNum{font-size:18px}
    .jar-reset{margin-top:2px}
    .namebar{border-top:none;padding-top:0;flex:0 0 130px}
    .namebar input{padding:6px 10px;font-size:15px}
    .namebar .opt{display:none}
  }
  @media (max-width:760px){
    body{padding:12px 12px 32px}
    .lg-nav{margin-bottom:12px}
    .lg-back span{display:none}
    .lg-back{padding:9px 11px}
    .lg-jumps{margin-left:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
    .lg-jumps::-webkit-scrollbar{display:none}
    .ttl{margin-bottom:12px}
    .ttl .sub{font-size:15px}
    .card{padding:14px;border-radius:18px}
  }
  @media (max-width:420px){
    .namebar{flex-basis:110px}
    .namebar label{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .board-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .board-top .lbl2{font-family:var(--round);font-weight:500;font-size:16px;color:var(--sky-deep)}
  .gembox{display:flex;align-items:center;gap:8px;background:var(--sun-soft);border:2px solid var(--sun-line);padding:5px 14px;border-radius:999px;transition:transform .35s ease}
  .gembox .ico{font-size:16px;color:#946C1E}
  .gembox b{font-family:var(--round);font-weight:600;font-size:19px;color:var(--ink-soft)}
  #board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .card-g{aspect-ratio:1/1;border-radius:16px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;cursor:pointer;text-align:center;line-height:1.2;transition:transform .12s ease}
  .card-g:hover{transform:translateY(-3px)}
  .card-g .lbl{font-family:var(--round);font-weight:500;font-size:16px}
  .card-g.matched{background:var(--mint-soft)!important;border-color:var(--mint-deep)!important}
  .card-g.matched .lbl{color:var(--mint-deep)!important}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .pop{animation:pop .35s ease}
  .wiggle{animation:wiggle .4s ease}
  .confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:50;border-radius:2px;pointer-events:none}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
  @media(max-width:520px){#board{gap:7px}.card-g{border-radius:12px;padding:3px;gap:2px}.card-g svg{width:28px;height:28px}.card-g .lbl{font-size:11px;line-height:1.1;word-break:break-word;hyphens:auto}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="lg-nav" aria-label="LittleGems activities">
    <a class="lg-back" href="/littlegems" aria-label="Back to LittleGems">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

      <div class="namebar">
        <label for="nick">My name <span class="opt">(optional)</span></label>
        <input id="nick" type="text" maxlength="14" placeholder="Your name" aria-label="Your nickname, optional">
      </div>
    </aside>
  </div>
  <p class="foot">Part of <a href="/littlegems">LittleGems</a> · free · no signup needed</p>
</div>

        '<path d="M23 43 Q32 48 41 43" stroke="'+STROKE+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+blush,
      silly: c+
        '<path d="M19 28 Q23 24 27 28" stroke="'+EYE+'" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<ellipse cx="40" cy="29" rx="3" ry="3.6" fill="'+EYE+'"/>'+
        '<path d="M22 40 Q32 47 42 40" stroke="'+STROKE+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
        '<path d="M28 43 Q28 53 35 51 Q38 50 37 44 Z" fill="#E8617A" stroke="'+STROKE+'" stroke-width="1"/>'+
        '<path d="M32 44 L32 49" stroke="#B5552E" stroke-width="0.8"/>'
    };
    return '<svg viewBox="0 0 64 64" width="42" height="42" aria-hidden="true">'+(f[type]||f.happy)+'</svg>';
  }
  function star(color){
    return '<svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><path d="M32 8 l7.2 15.4 16.8 1.9 -12.6 11.6 3.5 16.6 -14.9 -8.4 -14.9 8.4 3.5 -16.6 -12.6 -11.6 16.8 -1.9z" fill="'+color+'" opacity="0.92"/></svg>';
  }

  var BANK=[
    {key:"nervous",feel:"Nervous",situation:"First day at a new school"},
    {key:"proud",feel:"Proud",situation:"I finished something really hard"},
    {key:"grateful",feel:"Grateful",situation:"A friend helped me when I was stuck"},
    {key:"frustrated",feel:"Frustrated",situation:"My tower kept falling down"},
    {key:"happy",feel:"Happy",situation:"We got to play outside all afternoon"},
    {key:"sad",feel:"Sad",situation:"My best friend moved away"},
    {key:"excited",feel:"Excited",situation:"Tomorrow is my birthday party"},
    {key:"worried",feel:"Worried",situation:"I have a big test in the morning"},
    {key:"shy",feel:"Shy",situation:"I had to talk in front of the class"},
    {key:"calm",feel:"Calm",situation:"Reading a story before bedtime"},
    {key:"surprised",feel:"Surprised",situation:"There was a puppy waiting at home"},
    {key:"loved",feel:"Loved",situation:"Grandma gave me a big warm hug"},
    {key:"jealous",feel:"Jealous",situation:"My sister got a turn before me"},
    {key:"lonely",feel:"Lonely",situation:"Nobody picked me for their team"},
    {key:"hopeful",feel:"Hopeful",situation:"I'm trying again after I missed"},
    {key:"embarrassed",feel:"Embarrassed",situation:"I tripped in front of everyone"},
    {key:"brave",feel:"Brave",situation:"I went down the big slide by myself"},
    {key:"silly",feel:"Silly",situation:"We made up a goofy dance together"},
    {key:"frustrated",feel:"Frustrated",situation:"My shoelaces won't stay tied"},
    {key:"proud",feel:"Proud",situation:"I read a whole chapter book"},
    {key:"happy",feel:"Happy",situation:"My drawing went up on the fridge"},
    {key:"worried",feel:"Worried",situation:"My pet had to visit the vet"},
    {key:"grateful",feel:"Grateful",situation:"Someone shared their snack with me"},
    {key:"excited",feel:"Excited",situation:"We're going on a field trip today"}
  ];

  var SWATCHES=[
    {light:"#FDEDE4",dark:"#B5552E",raw:"#E07A52"},
    {light:"#E4F1F4",dark:"#2E6B78",raw:"#4E97A6"},
    {light:"#E8F3E9",dark:"#3F7A4A",raw:"#6BA876"},
    {light:"#FBF0DC",dark:"#946C1E",raw:"#D6A94E"}
  ];

  var ROUND=4;
  var board=document.getElementById("board"),msg=document.getElementById("msg"),
      gemEl=document.getElementById("gemcount"),gembox=document.getElementById("gembox");
  var flipped=[],gems=0,lock=false,roundPairs=ROUND;
  var cheers=["Lovely match!","You found a pair!","Beautifully done.","That's a match!"];

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function buildRound(){
    var picks=shuffle(BANK.slice()).slice(0,ROUND);
    var cards=[];
    picks.forEach(function(p,i){
      var sw=SWATCHES[i%SWATCHES.length];
      var c={raw:sw.raw,light:sw.light,dark:sw.dark};
      cards.push({pid:i,type:"feel",label:p.feel,art:face(p.key),c:c});
      cards.push({pid:i,type:"sit",label:p.situation,art:star(sw.raw),c:c});
    });
    return shuffle(cards);
  }
  function backFace(){return '<svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><path d="M32 10 L50 26 L32 54 L14 26 Z" fill="none" stroke="#D9C39A" stroke-width="3" stroke-linejoin="round"/><path d="M14 26 L50 26 M32 10 L24 26 M32 10 L40 26" stroke="#D9C39A" stroke-width="2"/></svg>';}

  function render(deck){
    board.innerHTML="";
    deck.forEach(function(card){
      var cell=document.createElement("button");
      cell.className="card-g";cell.setAttribute("aria-label","Hidden card");
      cell.innerHTML=backFace();
      cell.addEventListener("click",function(){flip(card,cell);});
      board.appendChild(cell);
    });
  }
  function flip(card,cell){
    if(lock||cell.dataset.open||cell.dataset.done)return;
    cell.style.background=card.c.light;cell.style.borderColor=card.c.raw;
    cell.className="card-g pop";cell.setAttribute("aria-label",card.label);
    cell.innerHTML=card.art+'<span class="lbl" style="color:'+card.c.dark+'">'+card.label+'</span>';
    cell.dataset.open="1";flipped.push({card:card,cell:cell});
    if(flipped.length===2){
      lock=true;var a=flipped[0],b=flipped[1];
      if(a.card.pid===b.card.pid&&a.card.type!==b.card.type){
        setTimeout(function(){
          [a,b].forEach(function(o){o.cell.dataset.done="1";o.cell.className="card-g matched wiggle";});
          gems++;gemEl.textContent=gems;
          gembox.classList.remove("pop");void gembox.offsetWidth;gembox.classList.add("pop");
          total++;saveTotal();drawJar();
          msg.innerHTML='<span class="ok">✦ '+cheers[gems%cheers.length]+'</span>';
          flipped=[];lock=false;
          if(gems===roundPairs){msg.innerHTML='<span class="win">◆ You collected every gem. Beautifully done. ✦</span>';celebrate();}
        },650);
      } else {
        msg.textContent="Not a match — try again.";
        setTimeout(function(){
          [a,b].forEach(function(o){o.cell.style.background="";o.cell.style.borderColor="";o.cell.className="card-g";o.cell.setAttribute("aria-label","Hidden card");o.cell.innerHTML=backFace();delete o.cell.dataset.open;});
          flipped=[];lock=false;
        },950);
      }
    }
  }
  function celebrate(){
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    var colors=["#E07A52","#4E97A6","#6BA876","#D6A94E","#B89248"];
    for(var i=0;i<60;i++){
      var c=document.createElement("div");c.className="confetti";
      c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];
      c.style.animation="fall "+(2+Math.random()*1.5)+"s linear "+(Math.random()*0.4)+"s forwards";
      document.body.appendChild(c);
      setTimeout((function(el){return function(){el.remove();};})(c),4200);
    }
  }
  var KEY_TOTAL="littlegems_match_total", KEY_NAME="littlegems_match_name";
  var total=0;
  var totalEl=document.getElementById("totalNum"),
      jarEl=document.getElementById("jar"),
      jarTitle=document.getElementById("jarTitle"),
      nickEl=document.getElementById("nick");

  function loadTotal(){
    try{var v=window.localStorage.getItem(KEY_TOTAL);total=v?parseInt(v,10)||0:0;}catch(e){total=0;}
  }
  function saveTotal(){
    try{window.localStorage.setItem(KEY_TOTAL,String(total));}catch(e){}
    totalEl.textContent=total;
  }
  function loadName(){
    try{var n=window.localStorage.getItem(KEY_NAME)||"";nickEl.value=n;applyName(n);}catch(e){}
  }
  function applyName(n){
    n=(n||"").trim();
    jarTitle.textContent=n?(n+"'s Gem Jar"):"My Gem Jar";
  }
  nickEl.addEventListener("input",function(){
    var n=nickEl.value.trim();
    applyName(n);
    try{window.localStorage.setItem(KEY_NAME,n);}catch(e){}
  });

  var GEMSHAPES=[
    ["#E07A52","#F0997B","#C96440"],
    ["#4E97A6","#7FB7C4","#3A7B89"],
    ["#6BA876","#97C49B","#4F8559"],
    ["#D6A94E","#E8C77E","#B5882E"],
    ["#C77EB5","#DDA8D0","#A85C97"],
    ["#D88AA0","#EBB3C2","#B5647C"]
  ];
  function gemSVG(x,y,s,cols){
    var w=24*s,h=20*s;
    return '<g transform="translate('+x+','+y+')" stroke="#5B3A8C" stroke-width="'+(2*s).toFixed(1)+'" stroke-linejoin="round">'+
      '<path d="M0 '+(6*s)+' L'+(8*s)+' '+(-6*s)+' L'+(20*s)+' '+(-6*s)+' L'+(28*s)+' '+(6*s)+' L'+(14*s)+' '+(16*s)+' Z" fill="'+cols[0]+'"/>'+
      '<path d="M'+(8*s)+' '+(-6*s)+' L'+(14*s)+' '+(4*s)+' L0 '+(6*s)+' Z" fill="'+cols[1]+'"/>'+
      '<path d="M'+(20*s)+' '+(-6*s)+' L'+(14*s)+' '+(4*s)+' L'+(28*s)+' '+(6*s)+' Z" fill="'+cols[2]+'"/>'+
      '</g>';
  }
  function drawJar(){
    totalEl.textContent=total;
    var jarBody='<ellipse cx="80" cy="170" rx="46" ry="8" fill="#000" opacity="0.06"/>'+
      '<path d="M52 30 h56 v8 q12 3 12 18 v74 q0 12 -14 12 h-52 q-14 0 -14 -12 v-74 q0 -15 12 -18 z" fill="#DCEEF3" stroke="#4E97A6" stroke-width="2.5" opacity="0.75"/>';
    var clip='<clipPath id="jarClip"><path d="M54 40 q-12 4 -12 18 v74 q0 10 14 10 h48 q14 0 14 -10 v-74 q0 -14 -12 -18 z"/></clipPath>';
    var shown=Math.min(total,28);
    var gemsHTML='';
    var cxC=80, floorY=124, rowH=11, gw=19, s=0.86;
    var caps=[2,3,3,4,4,4,5,5];
    var placed=0, row=0;
    while(placed<shown && row<caps.length){
      var capN=caps[row];
      var thisN=Math.min(capN, shown-placed);
      var y=floorY-row*rowH;
      var startX=cxC-((thisN-1)*gw)/2;
      for(var k=0;k<thisN;k++){
        var idx=placed+k;
        var x=startX+k*gw;
        var jx=((idx*29)%5)-2;
        var jy=((idx*17)%4)-2;
        var cols=GEMSHAPES[(idx*3+row)%GEMSHAPES.length];
        gemsHTML+=gemSVG(x+jx-13, y+jy, s, cols);
      }
      placed+=thisN; row++;
    }
    var lid='<path d="M52 30 h56 v8 h-56 z" fill="#B89248" stroke="#8C6E32" stroke-width="2"/>'+
      '<rect x="74" y="24" width="12" height="8" rx="2" fill="#C9A66C" stroke="#8C6E32" stroke-width="1.5"/>';
    jarEl.innerHTML=jarBody+clip+'<g clip-path="url(#jarClip)">'+gemsHTML+'</g>'+lid;
  }

  document.getElementById("jarReset").addEventListener("click",function(){
    if(window.confirm("Start your gem jar over from zero?")){
      total=0;saveTotal();drawJar();
    }
  });

  function start(){
    flipped=[];gems=0;lock=false;gemEl.textContent="0";
    msg.textContent="Tap two cards to find a matching pair.";
    var deck=buildRound();
    roundPairs=deck.length/2;
    render(deck);
  }
  document.getElementById("reset").addEventListener("click",start);
  loadTotal();loadName();drawJar();
  start();
})();
</script>
</body>
</html>
