<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calming game · LittleGems by MemoriGems</title>
<meta name="description" content="A free calming breathing activity for kids. Pick a gem, breathe along slowly, and help it feel calm, collecting gems along the way.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* LittleGems "Crayon box" theme — shared by the color studio, coloring sheets and the three games (Oct 2026).
     CONTRAST (white text): coral-deep #A9471F 5.8:1 · sky-deep #2E6B78 6.0:1 · mint-deep #3F7A4A 5.1:1.
     Light coral, sky, mint and sun are for fills, gems and borders only, never for small text. */
  :root{
    --bg:#FFF6EC;--paper:#FFFFFF;--line:#F2D9C4;--line-strong:#E6C2A6;
    --coral:#E07A52;--coral-deep:#A9471F;--coral-soft:#FDEDE4;
    --sky:#4E97A6;--sky-deep:#2E6B78;--sky-soft:#E4F1F4;
    --mint:#6BA876;--mint-deep:#3F7A4A;--mint-soft:#E8F3E9;
    --sun-soft:#FBF0DC;--sun-line:#E6C68A;
    --ink:#2A2317;--ink-soft:#524634;
    --round:'Fredoka','Nunito',system-ui,sans-serif;--sans:'Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);font-weight:700;color:var(--ink);background:var(--bg);padding:20px 16px 40px;min-height:100vh}
  button{font:inherit;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
  p{margin:0}
  .wrap{max-width:1040px;margin:0 auto}

  .lg-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .lg-back{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink-soft);background:var(--paper);border:2px solid var(--line);border-radius:100px;padding:9px 16px;transition:.2s}
  .lg-back:hover{border-color:var(--coral-deep);color:var(--coral-deep)}
  .lg-back svg{width:16px;height:16px}
  .lg-jumps{display:flex;gap:8px;margin-left:auto}
  .jump-btn{display:inline-flex;align-items:center;font-family:var(--round);font-weight:500;font-size:14px;padding:8px 14px;border-radius:100px;border:2px solid var(--line);color:var(--ink-soft);background:var(--paper);text-decoration:none;white-space:nowrap;transition:.2s}
  a.jump-btn:hover{border-color:var(--coral-deep);color:var(--coral-deep)}
  .jump-btn.active{background:var(--coral-deep);border-color:var(--coral-deep);color:#fff;cursor:default}

  .ttl{margin:0 0 16px}
  .ttl h1{margin:0;font-family:var(--round);font-weight:600;font-size:clamp(28px,4vw,36px);line-height:1.05;color:var(--ink-soft)}
  .ttl h1 em{font-style:normal;color:var(--coral-deep)}
  .ttl .sub{margin-top:6px;font-size:17px;font-weight:600;color:var(--ink-soft)}

  .card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:22px}
  .gl{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px}
  .jar-wrap{display:flex;align-items:center;gap:14px}
  .jar-wrap svg{flex:0 0 auto;width:96px;height:108px}
  .jar-title{font-family:var(--round);font-weight:600;font-size:20px;color:var(--ink-soft);margin:0 0 2px}
  .jar-total{font-size:15px;color:var(--ink-soft);margin:0}
  .jar-total #totalNum{font-family:var(--round);font-weight:600;font-size:24px;color:var(--coral-deep)}
  .jar-reset{font-weight:800;font-size:13px;color:var(--coral-deep);background:none;border:none;cursor:pointer;margin-top:6px;padding:0;text-decoration:underline}
  .namebar{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--line);padding-top:12px}
  .namebar label{font-size:13px;font-weight:800;color:var(--ink-soft)}
  .namebar input{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--ink);border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;outline:none;width:100%}
  .namebar input:focus{border-color:var(--sky-deep)}
  .namebar input::placeholder{color:#8A7C68}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--round);font-weight:500;font-size:18px;padding:13px 28px;border-radius:16px;background:var(--coral-deep);color:#fff;border:none;cursor:pointer;transition:.2s}
  .btn:hover{background:#923B17;transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;cursor:default;transform:none}
  .msg{text-align:center;margin-top:16px;min-height:26px;font-size:17px;font-weight:700;color:var(--ink-soft)}
  .msg .ok{color:var(--mint-deep);font-weight:800}
  .msg .win{color:var(--coral-deep);font-weight:800}
  .controls{text-align:center;margin-top:12px}
  .foot{text-align:center;margin-top:24px;font-size:14px;font-weight:600;color:var(--ink-soft)}
  .foot a{color:var(--coral-deep);font-weight:800;text-decoration:none}

  @media (max-width:860px){
    .gl{grid-template-columns:minmax(0,1fr);gap:12px}
    .side{order:-1;flex-direction:row;align-items:center;gap:12px;padding:10px 14px;border-radius:18px}
    .jar-wrap{flex:1;gap:10px}
    .jar-wrap svg{width:48px;height:54px}
    .jar-title{font-size:16px}
    .jar-total #totalNum{font-size:18px}
    .jar-reset{margin-top:2px}
    .namebar{border-top:none;padding-top:0;flex:0 0 130px}
    .namebar input{padding:6px 10px;font-size:15px}
    .namebar .opt{display:none}
  }
  @media (max-width:760px){
    body{padding:12px 12px 32px}
    .lg-nav{margin-bottom:12px}
    .lg-back span{display:none}
    .lg-back{padding:9px 11px}
    .lg-jumps{margin-left:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
    .lg-jumps::-webkit-scrollbar{display:none}
    .ttl{margin-bottom:12px}
    .ttl .sub{font-size:15px}
    .card{padding:14px;border-radius:18px}
  }
  @media (max-width:420px){
    .namebar{flex-basis:110px}
    .namebar label{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .game{text-align:center}
  .stage{position:relative;height:250px;display:flex;align-items:center;justify-content:center}
  .stage svg{overflow:visible}
  .cue{font-family:var(--round);font-weight:500;font-size:26px;color:var(--sky-deep);min-height:34px;margin:4px 0}
  .count{font-size:14px;font-weight:800;color:var(--ink-soft);min-height:20px;margin:0 0 14px}
  .ctl{border-top:2px solid var(--line);padding-top:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .pick-label{font-family:var(--round);font-weight:500;font-size:16px;color:var(--sky-deep)}
  .picker{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .pick{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px;cursor:pointer;transition:transform .12s,border-color .2s;line-height:0}
  .pick:hover{transform:translateY(-3px)}
  .pick.sel{border-color:var(--sky-deep);background:var(--sky-soft)}
  .breath-len{display:flex;gap:4px;padding:4px;border-radius:999px;border:2px solid var(--line);background:#fff}
  .lenbtn{font-weight:800;font-size:14px;padding:8px 18px;border-radius:999px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer}
  .lenbtn.sel{background:var(--sky-deep);color:#fff}
  @media(max-width:760px){.stage{height:200px}.stage svg{width:170px;height:170px}.cue{font-size:21px}.pick svg{width:40px;height:40px}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="lg-nav" aria-label="LittleGems activities">
    <a class="lg-back" href="/littlegems" aria-label="Back to LittleGems">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Back to LittleGems</span>
    </a>
    <div class="lg-jumps">
      <a class="jump-btn" href="/littlegems/color">Color online</a>
      <a class="jump-btn" href="/littlegems/sheets">Coloring sheets</a>
      <a class="jump-btn" href="/littlegems/match">Match game</a>
      <a class="jump-btn" href="/littlegems/choices">Kindness game</a>
      <span class="jump-btn active" aria-current="page">Calming game</span>
    </div>
  </nav>
  <header class="ttl"><h1>Calming <em>game</em></h1><p class="sub">Pick a gem, then breathe slowly to help it feel calm.</p></header>
  <div class="gl">
    <section class="card game" aria-label="Calming game">
      <div class="stage"><svg id="cg" viewBox="0 0 200 200" width="210" height="210" aria-hidden="true"></svg></div>
      <p class="cue" id="cue">Choose a gem to begin.</p>
      <p class="count" id="count"></p>
      <div class="ctl">
        <p class="pick-label" id="pickLabel">Pick your gem</p>
        <div class="picker" id="picker"></div>
        <div class="breath-len" id="lenRow">
          <button class="lenbtn sel" data-n="3">3 breaths</button>
          <button class="lenbtn" data-n="5">5 breaths</button>
        </div>
        <button class="btn" id="go" disabled>Begin</button>
      </div>
    </section>
    <aside class="card side" aria-label="My gem jar">
      <div class="jar-wrap">
        <svg id="jar" viewBox="0 0 160 180" width="120" height="135" aria-label="Your gem jar"></svg>
        <div class="jar-info">
          <p class="jar-title" id="jarTitle">My Gem Jar</p>
          <p class="jar-total"><span id="totalNum">0</span> <span>gems collected</span></p>
          <button class="jar-reset" id="jarReset">Start over</button>
        </div>
      </div>
      <div class="namebar">
        <label for="nick">My name <span class="opt">(optional)</span></label>
        <input id="nick" type="text" maxlength="14" placeholder="Your name" aria-label="Your nickname, optional">
      </div>
    </aside>
  </div>
  <p class="foot">Part of <a href="/littlegems">LittleGems</a> · free · no signup needed</p>
</div>
<script>(function(){var a=document.querySelector(".lg-jumps .active");if(a&&a.parentNode.scrollWidth>a.parentNode.clientWidth){a.parentNode.scrollLeft=a.offsetLeft-a.parentNode.offsetLeft-12;}})();</script>
<script>
(function(){
  var GEMS=[
    {name:"coral", shape:"round",    hot:{base:"#E07A52",lt:"#F0997B",dk:"#C96440"}},
    {name:"rose",  shape:"oval",     hot:{base:"#D4537E",lt:"#E48BA6",dk:"#A83D63"}},
    {name:"amber", shape:"teardrop", hot:{base:"#E0A93E",lt:"#EEC97A",dk:"#B5882E"}},
    {name:"violet",shape:"hexagon",  hot:{base:"#8E72C7",lt:"#B3A0DC",dk:"#6E55A3"}},
    {name:"green", shape:"diamond",  hot:{base:"#6BA876",lt:"#97C49B",dk:"#4F8559"}}
  ];
  var CALM={base:"#4E97A6",lt:"#7FB7C4",dk:"#3A7B89"};

  function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
  function mix(c1,c2,t){var a=hex(c1),b=hex(c2);function L(i){return Math.round(a[i]+(b[i]-a[i])*t);}return 'rgb('+L(0)+','+L(1)+','+L(2)+')';}

  var O="#5B3A8C";
  function shapeSVG(shape,cx,cy,s,base,lt,dk,sw){
    if(shape==="round"){
      var rr=20*s;
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="'+base+'" stroke="'+O+'" stroke-width="'+sw+'"/>'+
        '<path d="M'+cx+' '+(cy-rr)+' L'+(cx+rr*0.72)+' '+(cy-rr*0.44)+' L'+cx+' '+cy+' L'+(cx-rr*0.72)+' '+(cy-rr*0.44)+' Z" fill="'+lt+'"/>'+
        '<path d="M'+(cx+rr*0.72)+' '+(cy-rr*0.44)+' L'+(cx+rr*0.72)+' '+(cy+rr*0.44)+' L'+cx+' '+cy+' Z" fill="'+dk+'"/>'+
        '<path d="M'+(cx-rr*0.72)+' '+(cy-rr*0.44)+' L'+(cx-rr*0.72)+' '+(cy+rr*0.44)+' L'+cx+' '+cy+' Z" fill="'+dk+'" opacity="0.65"/>'+
        '<path d="M'+(cx-rr*0.72)+' '+(cy+rr*0.44)+' L'+cx+' '+(cy+rr)+' L'+(cx+rr*0.72)+' '+(cy+rr*0.44)+' L'+cx+' '+cy+' Z" fill="'+base+'"/>';
    }
    if(shape==="oval"){
      var rx=16*s, ry=21*s;
      return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+base+'" stroke="'+O+'" stroke-width="'+sw+'"/>'+
        '<path d="M'+cx+' '+(cy-ry)+' L'+(cx+rx)+' '+cy+' L'+cx+' '+cy+' Z" fill="'+dk+'"/>'+
        '<path d="M'+cx+' '+(cy-ry)+' L'+(cx-rx)+' '+cy+' L'+cx+' '+cy+' Z" fill="'+lt+'"/>'+
        '<path d="M'+(cx-rx)+' '+cy+' L'+cx+' '+(cy+ry)+' L'+cx+' '+cy+' Z" fill="'+base+'"/>'+
        '<path d="M'+(cx+rx)+' '+cy+' L'+cx+' '+(cy+ry)+' L'+cx+' '+cy+' Z" fill="'+dk+'" opacity="0.7"/>';
    }
    if(shape==="teardrop"){
      var u=21*s, w=16*s, bw=16*s, bh=14*s;
      return '<path d="M'+cx+' '+(cy-u)+' C'+(cx+w*0.9)+' '+(cy-4*s)+' '+(cx+bw)+' '+(cy+4*s)+' '+(cx+bw)+' '+(cy+8*s)+' A'+bw+' '+bh+' 0 1 1 '+(cx-bw)+' '+(cy+8*s)+' C'+(cx-bw)+' '+(cy+4*s)+' '+(cx-w*0.9)+' '+(cy-4*s)+' '+cx+' '+(cy-u)+' Z" fill="'+base+'" stroke="'+O+'" stroke-width="'+sw+'" stroke-linejoin="round"/>'+
        '<path d="M'+cx+' '+(cy-u)+' C'+(cx+w*0.65)+' '+(cy-4*s)+' '+(cx+w*0.8)+' '+(cy+4*s)+' '+cx+' '+(cy+6*s)+' Z" fill="'+dk+'"/>'+
        '<path d="M'+cx+' '+(cy-u)+' C'+(cx-w*0.65)+' '+(cy-4*s)+' '+(cx-w*0.8)+' '+(cy+4*s)+' '+cx+' '+(cy+6*s)+' Z" fill="'+lt+'"/>';
    }
    if(shape==="hexagon"){
      var hw=19*s, hh=21*s;
      return '<path d="M'+(cx-hw*0.5)+' '+(cy-hh)+' L'+(cx+hw*0.5)+' '+(cy-hh)+' L'+(cx+hw)+' '+cy+' L'+(cx+hw*0.5)+' '+(cy+hh)+' L'+(cx-hw*0.5)+' '+(cy+hh)+' L'+(cx-hw)+' '+cy+' Z" fill="'+base+'" stroke="'+O+'" stroke-width="'+sw+'" stroke-linejoin="round"/>'+
        '<path d="M'+(cx-hw*0.5)+' '+(cy-hh)+' L'+(cx+hw*0.5)+' '+(cy-hh)+' L'+cx+' '+cy+' Z" fill="'+lt+'"/>'+
        '<path d="M'+(cx+hw*0.5)+' '+(cy-hh)+' L'+(cx+hw)+' '+cy+' L'+cx+' '+cy+' Z" fill="'+dk+'"/>'+
        '<path d="M'+(cx-hw)+' '+cy+' L'+(cx-hw*0.5)+' '+(cy+hh)+' L'+cx+' '+cy+' Z" fill="'+dk+'" opacity="0.6"/>'+
        '<path d="M'+(cx+hw*0.5)+' '+(cy+hh)+' L'+(cx+hw)+' '+cy+' L'+cx+' '+cy+' Z" fill="'+lt+'" opacity="0.5"/>';
    }
    var w2=36*s,h2=44*s,top=cy-h2*0.55,bot=cy+h2*0.55,l=cx-w2/2,r=cx+w2/2,m=cy-h2*0.12;
    return '<path d="M'+cx+' '+top+' L'+r+' '+m+' L'+cx+' '+bot+' L'+l+' '+m+' Z" fill="'+base+'" stroke="'+O+'" stroke-width="'+sw+'" stroke-linejoin="round"/>'+
      '<path d="M'+cx+' '+top+' L'+cx+' '+(m-2)+' L'+l+' '+m+' Z" fill="'+lt+'"/>'+
      '<path d="M'+cx+' '+top+' L'+cx+' '+(m-2)+' L'+r+' '+m+' Z" fill="'+dk+'"/>'+
      '<path d="M'+l+' '+m+' L'+cx+' '+(m+2)+' L'+cx+' '+bot+' Z" fill="'+base+'"/>'+
      '<path d="M'+r+' '+m+' L'+cx+' '+(m+2)+' L'+cx+' '+bot+' Z" fill="'+dk+'" opacity="0.8"/>';
  }

  function thumb(gem){
    var c=gem.hot;
    return '<svg viewBox="0 0 60 60" width="50" height="50" aria-hidden="true">'+
      shapeSVG(gem.shape,30,30,1.35,c.base,c.lt,c.dk,2.5)+'</svg>';
  }

  var picker=document.getElementById("picker"),
      svg=document.getElementById("cg"), cue=document.getElementById("cue"),
      countEl=document.getElementById("count"), go=document.getElementById("go"),
      pickLabel=document.getElementById("pickLabel"), lenRow=document.getElementById("lenRow");
  var chosen=null, breaths=3, running=false;

  GEMS.forEach(function(gem,i){
    var b=document.createElement("button");
    b.className="pick"; b.setAttribute("aria-label","Choose the "+gem.name+" gem");
    b.innerHTML=thumb(gem);
    b.addEventListener("click",function(){
      if(running)return;
      chosen=gem;
      [].forEach.call(picker.children,function(c){c.classList.remove("sel");});
      b.classList.add("sel");
      go.disabled=false;
      cue.textContent="Press Begin when you're ready.";
      drawGem(0.85,0);
    });
    picker.appendChild(b);
  });

  [].forEach.call(lenRow.children,function(btn){
    btn.addEventListener("click",function(){
      if(running)return;
      breaths=parseInt(btn.dataset.n,10);
      [].forEach.call(lenRow.children,function(c){c.classList.remove("sel");});
      btn.classList.add("sel");
    });
  });

  function drawGem(scale,warmth){
    if(!chosen){svg.innerHTML="";return;}
    var c=chosen.hot;
    var base=mix(c.base,CALM.base,warmth), lt=mix(c.lt,CALM.lt,warmth), dk=mix(c.dk,CALM.dk,warmth);
    var cx=100,cy=100;
    var halo=warmth<0.6?'<circle cx="100" cy="100" r="'+(46*scale)+'" fill="rgba(224,122,82,'+(0.16*(1-warmth)).toFixed(3)+')"/>':'';
    svg.innerHTML=halo+shapeSVG(chosen.shape,cx,cy,2.0*scale,base,lt,dk,3);
  }

  function session(){
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    var IN=reduce?900:3000, OUT=reduce?900:3000, HOLD=reduce?200:600;
    function breath(n){
      if(n>breaths){
        cue.textContent="Ahh… all calm.";
        countEl.innerHTML='<span style="color:#3F7A4A;font-weight:800">✦ gem earned</span>';
        drawGem(1.0,1);
        total++;saveTotal();drawJar();
        running=false; go.disabled=false; go.style.display=""; go.textContent="Again";
        return;
      }
      countEl.textContent="Breath "+n+" of "+breaths;
      var base=(n-1)/breaths, step=1/breaths;
      cue.textContent="Breathe in…";
      var t0=Date.now();
      function animIn(){
        var p=Math.min((Date.now()-t0)/IN,1);
        drawGem(0.85+0.5*p, base+step*0.5*p);
        if(p<1)requestAnimationFrame(animIn);
        else{cue.textContent="Hold…";setTimeout(startOut,HOLD);}
      }
      function startOut(){
        cue.textContent="Breathe out…";
        var t1=Date.now();
        function animOut(){
          var p=Math.min((Date.now()-t1)/OUT,1);
          drawGem(1.35-0.5*p, base+step*(0.5+0.5*p));
          if(p<1)requestAnimationFrame(animOut);
          else setTimeout(function(){breath(n+1);},300);
        }
        animOut();
      }
      animIn();
    }
    breath(1);
  }

  go.addEventListener("click",function(){
    if(running||!chosen)return;
    running=true; go.style.display="none";
    session();
  });

  var KEY_TOTAL="littlegems_match_total", KEY_NAME="littlegems_match_name";
  var total=0;
  var totalEl=document.getElementById("totalNum"),
      jarEl=document.getElementById("jar"),
      jarTitle=document.getElementById("jarTitle"),
      nickEl=document.getElementById("nick");

  function loadTotal(){try{var v=window.localStorage.getItem(KEY_TOTAL);total=v?parseInt(v,10)||0:0;}catch(e){total=0;}}
  function saveTotal(){try{window.localStorage.setItem(KEY_TOTAL,String(total));}catch(e){}totalEl.textContent=total;}
  function loadName(){try{var n=window.localStorage.getItem(KEY_NAME)||"";nickEl.value=n;applyName(n);}catch(e){}}
  function applyName(n){n=(n||"").trim();jarTitle.textContent=n?(n+"'s Gem Jar"):"My Gem Jar";}
  nickEl.addEventListener("input",function(){var n=nickEl.value.trim();applyName(n);try{window.localStorage.setItem(KEY_NAME,n);}catch(e){}});

  var GEMSHAPES=[
    ["#E07A52","#F0997B","#C96440"],["#4E97A6","#7FB7C4","#3A7B89"],
    ["#6BA876","#97C49B","#4F8559"],["#D6A94E","#E8C77E","#B5882E"],
    ["#C77EB5","#DDA8D0","#A85C97"],["#D88AA0","#EBB3C2","#B5647C"]
  ];
  function gemSVG(x,y,s,cols){
    return '<g transform="translate('+x+','+y+')" stroke="#5B3A8C" stroke-width="'+(2*s).toFixed(1)+'" stroke-linejoin="round">'+
      '<path d="M0 '+(6*s)+' L'+(8*s)+' '+(-6*s)+' L'+(20*s)+' '+(-6*s)+' L'+(28*s)+' '+(6*s)+' L'+(14*s)+' '+(16*s)+' Z" fill="'+cols[0]+'"/>'+
      '<path d="M'+(8*s)+' '+(-6*s)+' L'+(14*s)+' '+(4*s)+' L0 '+(6*s)+' Z" fill="'+cols[1]+'"/>'+
      '<path d="M'+(20*s)+' '+(-6*s)+' L'+(14*s)+' '+(4*s)+' L'+(28*s)+' '+(6*s)+' Z" fill="'+cols[2]+'"/>'+
      '</g>';
  }
  function drawJar(){
    totalEl.textContent=total;
    var jarBody='<ellipse cx="80" cy="170" rx="46" ry="8" fill="#000" opacity="0.06"/>'+
      '<path d="M52 30 h56 v8 q12 3 12 18 v74 q0 12 -14 12 h-52 q-14 0 -14 -12 v-74 q0 -15 12 -18 z" fill="#DCEEF3" stroke="#4E97A6" stroke-width="2.5" opacity="0.75"/>';
    var clip='<clipPath id="jarClip"><path d="M54 40 q-12 4 -12 18 v74 q0 10 14 10 h48 q14 0 14 -10 v-74 q0 -14 -12 -18 z"/></clipPath>';
    var shown=Math.min(total,28);
    var gemsHTML='';
    var cxC=80, floorY=124, rowH=11, gw=19, s=0.86;
    var caps=[2,3,3,4,4,4,5,5];
    var placed=0, row=0;
    while(placed<shown && row<caps.length){
      var capN=caps[row];var thisN=Math.min(capN, shown-placed);
      var y=floorY-row*rowH;var startX=cxC-((thisN-1)*gw)/2;
      for(var k=0;k<thisN;k++){
        var idx=placed+k;var x=startX+k*gw;
        var jx=((idx*29)%5)-2;var jy=((idx*17)%4)-2;
        var cols=GEMSHAPES[(idx*3+row)%GEMSHAPES.length];
        gemsHTML+=gemSVG(x+jx-13, y+jy, s, cols);
      }
      placed+=thisN; row++;
    }
    var lid='<path d="M52 30 h56 v8 h-56 z" fill="#B89248" stroke="#8C6E32" stroke-width="2"/>'+
      '<rect x="74" y="24" width="12" height="8" rx="2" fill="#C9A66C" stroke="#8C6E32" stroke-width="1.5"/>';
    jarEl.innerHTML=jarBody+clip+'<g clip-path="url(#jarClip)">'+gemsHTML+'</g>'+lid;
  }

  document.getElementById("jarReset").addEventListener("click",function(){
    if(window.confirm("Start your gem jar over from zero?")){total=0;saveTotal();drawJar();}
  });

  loadTotal();loadName();drawJar();
  if(picker.firstChild)picker.firstChild.click();
})();
</script>
</body>
